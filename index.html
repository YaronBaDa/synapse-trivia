<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Synapse Trivia</title>
<style>
:root {
  --bg: #0f1115;
  --surface: #181b21;
  --surface-2: #20242c;
  --ink: #e8e6e3;
  --ink-faint: #8a8580;
  --border: #2a2f38;
  --accent: #58a6ff;
  --accent-warm: #c75b39;
  --correct: #10b981;
  --wrong: #f43f5e;
  --warning: #f59e0b;
  --shadow: 0 2px 12px rgba(0,0,0,0.45);
  --radius: 14px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-serif: Georgia, "Times New Roman", serif;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f4f0;
    --surface: #ffffff;
    --surface-2: #f0ece6;
    --ink: #1a1a1a;
    --ink-faint: #6b6560;
    --border: #ddd8d0;
    --accent: #2563eb;
    --accent-warm: #c75b39;
    --correct: #059669;
    --wrong: #e11d48;
    --warning: #d97706;
    --shadow: 0 2px 10px rgba(0,0,0,0.08);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; font-family: var(--font-sans); background: var(--bg); color: var(--ink); overflow: hidden; }
#app { max-width: 640px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; position: relative; }
.screen { display: none; flex-direction: column; height: 100vh; overflow: hidden; padding: 16px; }
.screen.active { display: flex; }

/* Header */
.game-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 12px; flex-shrink: 0; }
.game-header h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
.game-header .meta { font-size: 13px; color: var(--ink-faint); font-weight: 500; }
.header-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: transform .12s;
}
.icon-btn:active { transform: scale(0.92); }

/* Landing */
.landing-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px; }
.landing-body .logo { font-size: 56px; line-height: 1; }
.landing-body h2 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
.landing-body p { font-size: 15px; color: var(--ink-faint); max-width: 320px; margin: 0; line-height: 1.5; }
.btn-primary {
  width: 100%; max-width: 280px; padding: 14px 20px; border-radius: var(--radius); border: none;
  background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  box-shadow: var(--shadow); transition: transform .12s, filter .12s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  width: 100%; max-width: 280px; padding: 12px 20px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer;
  transition: transform .12s;
}
.btn-secondary:active { transform: scale(0.97); }
.btn-primary:disabled, .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

/* Stats bar */
.stats-bar { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
.stat-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink-faint); }
.stat-chip b { color: var(--ink); margin-left: 3px; }

/* Question */
.question-stage { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.question-tracker { font-size: 12px; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
.question-text { font-size: 20px; font-weight: 700; line-height: 1.35; margin: 0 0 20px; }
.question-text .category-tag {
  display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--accent); margin-bottom: 10px;
}

/* Options */
.options-grid { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; margin-bottom: 16px; }
.option-btn {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 600;
  cursor: pointer; text-align: left; transition: transform .1s, border-color .2s, background .2s; position: relative; overflow: hidden;
}
.option-btn:active { transform: scale(0.985); }
.option-btn .key-hint {
  width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--ink-faint); flex-shrink: 0;
}
.option-btn.correct { border-color: var(--correct); background: rgba(16,185,129,0.08); }
.option-btn.wrong { border-color: var(--wrong); background: rgba(244,63,94,0.08); animation: shake 0.4s ease-in-out; }
.option-btn.dimmed { opacity: 0.35; pointer-events: none; }

@keyframes shake {
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)}
}

/* Feedback strip */
.feedback-strip {
  text-align: center; padding: 14px; border-radius: var(--radius); margin-bottom: 14px;
  border: 1px solid var(--border); background: var(--surface); opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s;
}
.feedback-strip.show { opacity: 1; transform: translateY(0); }
.feedback-strip.correct { border-color: var(--correct); }
.feedback-strip.wrong { border-color: var(--wrong); }
.feedback-strip .fb-result { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.feedback-strip .fb-insight { font-size: 13px; color: var(--ink-faint); line-height: 1.45; font-style: italic; font-family: var(--font-serif); }

/* Hearts */
.hearts-bar { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
.heart { font-size: 20px; transition: transform .3s, opacity .3s; }
.heart.lost { opacity: 0.25; transform: scale(0.8); filter: grayscale(1); }

/* Timer */
.timer-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 12px; overflow: hidden; flex-shrink: 0; }
.timer-bar .timer-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1s linear; }

/* Share / results */
.results-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 16px; min-height: 0; overflow-y: auto; }
.results-score { font-size: 48px; font-weight: 800; line-height: 1; }
.results-label { font-size: 15px; color: var(--ink-faint); font-weight: 500; }
.share-grid { display: flex; flex-direction: column; gap: 4px; font-size: 18px; line-height: 1; }
.share-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--surface-2); padding: 12px; border-radius: 10px; border: 1px solid var(--border); max-width: 320px; width: 100%; word-break: break-word; text-align: left; }

/* Endless stats overlay */
.endless-stats { display: flex; gap: 16px; justify-content: center; margin-bottom: 8px; }
.endless-stat { text-align: center; }
.endless-stat .val { font-size: 22px; font-weight: 800; display: block; }
.endless-stat .lbl { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; }

/* Toasts */
#toast-host { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; pointer-events: none; }
.toast { background: var(--surface); border: 1px solid var(--border); color: var(--ink); padding: 10px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); margin-top: 8px; animation: toastIn .3s ease; }
@keyframes toastIn { from { opacity:0; transform:translateY(10px)} to { opacity:1; transform:translateY(0)} }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>
<div id="app">

  <!-- LANDING -->
  <div id="screen-landing" class="screen active">
    <div class="game-header"><h1>Synapse</h1><div class="meta">Trivia</div></div>
    <div class="landing-body">
      <div class="logo">🧠</div>
      <h2>Synapse Trivia</h2>
      <p>10 questions. No ads. No coins. Just pure knowledge.</p>
      <div class="stats-bar" id="landing-stats"></div>
      <button class="btn-primary" id="btn-daily">▶ Play Daily 10</button>
      <button class="btn-secondary" id="btn-endless">♾️ Endless Gauntlet</button>
    </div>
  </div>

  <!-- PLAYING -->
  <div id="screen-playing" class="screen">
    <div class="game-header">
      <h1 id="mode-title">Daily 10</h1>
      <div class="header-actions">
        <button class="icon-btn" id="btn-mute" aria-label="Toggle sound">🔊</button>
        <button class="icon-btn" id="btn-close" aria-label="Quit">✕</button>
      </div>
    </div>
    <div id="hearts-bar" class="hearts-bar" style="display:none;"></div>
    <div class="timer-bar" id="timer-bar" style="display:none;"><div class="timer-fill" id="timer-fill"></div></div>
    <div class="question-stage">
      <div class="question-tracker" id="q-tracker">Question 1 / 10</div>
      <div class="question-text" id="q-text">Loading...</div>
    </div>
    <div id="feedback-strip" class="feedback-strip">
      <div class="fb-result" id="fb-result"></div>
      <div class="fb-insight" id="fb-insight"></div>
    </div>
    <div class="options-grid" id="options-grid"></div>
  </div>

  <!-- RESULTS -->
  <div id="screen-results" class="screen">
    <div class="game-header"><h1 id="result-title">Done</h1><div class="meta" id="result-meta"></div></div>
    <div class="results-body">
      <div class="results-score" id="result-score">8/10</div>
      <div class="results-label" id="result-label">Great job!</div>
      <div class="endless-stats" id="endless-stats" style="display:none;"></div>
      <div class="share-grid" id="share-grid"></div>
      <div class="share-text" id="share-text"></div>
      <button class="btn-primary" id="btn-copy">📋 Copy Results</button>
      <button class="btn-secondary" id="btn-again">Play Again</button>
      <button class="btn-secondary" id="btn-home">🏠 Home</button>
    </div>
  </div>

</div>
<div id="toast-host"></div>

<script>
/* ================================================================
   SYNAPSE TRIVIA — Single-file prototype
   ================================================================ */

// ---- Audio Engine ----
class AudioEngine {
  constructor() {
    this.ctx = null; this.master = null; this.enabled = true;
  }
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.2;
    this.master.connect(this.ctx.destination);
  }
  _tone(freq, type, dur, fade=true) {
    if (!this.enabled || !this.ctx) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, this.ctx.currentTime);
    g.gain.setValueAtTime(0.25, this.ctx.currentTime);
    if (fade) g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
    o.connect(g); g.connect(this.master);
    o.start(); o.stop(this.ctx.currentTime + dur);
  }
  click() { this.init(); this._tone(880, 'sine', 0.05); }
  correct() { this.init(); [523.25,659.25,783.99].forEach((f,i)=>setTimeout(()=>this._tone(f,'sine',0.35),i*60)); }
  wrong() { this.init(); const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(180,this.ctx.currentTime); o.frequency.linearRampToValueAtTime(90,this.ctx.currentTime+0.22); g.gain.setValueAtTime(0.15,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.25); o.connect(g); g.connect(this.master); o.start(); o.stop(this.ctx.currentTime+0.28); }
}
const audio = new AudioEngine();

// ---- Deterministic PRNG ----
function mulberry32(a) {
  return function() {
    var t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  }
}
function getDailySeed() {
  const d = new Date();
  return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
}
function seededShuffle(arr, seed) {
  const rng = mulberry32(seed);
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--) { const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// ---- Curated Question Bank ----
const QUESTIONS = [
  { id:"q1", category:"Science", difficulty:"medium", question:"What is the only planet in our solar system that rotates clockwise?", options:["Venus","Mars","Jupiter","Saturn"], correctIndex:0, didYouKnow:"Venus spins in the opposite direction to most planets, so the Sun rises in the west." },
  { id:"q2", category:"History", difficulty:"easy", question:"In which year did the Berlin Wall fall?", options:["1987","1989","1991","1993"], correctIndex:1, didYouKnow:"The fall began on November 9, 1989, after a mistaken announcement by a East German official." },
  { id:"q3", category:"Geography", difficulty:"medium", question:"Which country has the most time zones?", options:["Russia","USA","France","China"], correctIndex:2, didYouKnow:"France has 12 time zones thanks to its overseas territories scattered across the globe." },
  { id:"q4", category:"Literature", difficulty:"hard", question:"Who wrote the epic poem 'Paradise Lost'?", options:["John Donne","John Milton","Alexander Pope","William Blake"], correctIndex:1, didYouKnow:"Milton was completely blind when he dictated the 10,000-line poem to assistants." },
  { id:"q5", category:"Pop Culture", difficulty:"easy", question:"Which artist released the album '1989' in 2014?", options:["Katy Perry","Adele","Taylor Swift","Lady Gaga"], correctIndex:2, didYouKnow:"The album marked her official shift from country to synth-pop and won Album of the Year." },
  { id:"q6", category:"Science", difficulty:"hard", question:"What is the smallest unit of matter that retains the properties of an element?", options:["Electron","Proton","Atom","Quark"], correctIndex:2, didYouKnow:"The word atom comes from the Greek atomos, meaning indivisible — though we now know it can be split." },
  { id:"q7", category:"History", difficulty:"medium", question:"The ancient city of Petra is located in which modern-day country?", options:["Egypt","Jordan","Syria","Lebanon"], correctIndex:1, didYouKnow:"Petra was carved directly into rose-red sandstone cliffs by the Nabataeans over 2,000 years ago." },
  { id:"q8", category:"Geography", difficulty:"easy", question:"What is the capital of Australia?", options:["Sydney","Melbourne","Canberra","Brisbane"], correctIndex:2, didYouKnow:"Canberra was purpose-built as a compromise between rivals Sydney and Melbourne in 1913." },
  { id:"q9", category:"Literature", difficulty:"medium", question:"In '1984', what is the name of the totalitarian regime's leader?", options:["Big Brother","The Party","O'Brien","Goldstein"], correctIndex:0, didYouKnow:"George Orwell never confirms whether Big Brother is a real person or simply a propaganda construct." },
  { id:"q10", category:"General", difficulty:"medium", question:"How many bones are in the adult human body?", options:["186","206","216","256"], correctIndex:1, didYouKnow:"Babies are born with about 270 bones — many fuse together during growth, which is why adults have fewer." },
  { id:"q11", category:"Science", difficulty:"easy", question:"What gas do plants absorb from the atmosphere?", options:["Oxygen","Carbon Dioxide","Nitrogen","Hydrogen"], correctIndex:1, didYouKnow:"A single mature tree can absorb about 22kg of CO₂ from the atmosphere every year." },
  { id:"q12", category:"History", difficulty:"hard", question:"The Battle of Hastings took place in which year?", options:["1042","1066","1087","1100"], correctIndex:1, didYouKnow:"William the Conqueror's victory in 1066 transformed the English language, adding thousands of French words." },
  { id:"q13", category:"Geography", difficulty:"hard", question:"Lake Baikal, the world's deepest lake, is located in which country?", options:["Canada","Russia","Mongolia","Kazakhstan"], correctIndex:1, didYouKnow:"Baikal holds roughly 20% of the world's unfrozen freshwater and is over 25 million years old." },
  { id:"q14", category:"Pop Culture", difficulty:"medium", question:"Which film won the first Academy Award for Best Animated Feature?", options:["Toy Story 2","Shrek","Monsters, Inc.","Finding Nemo"], correctIndex:1, didYouKnow:"Shrek beat Monsters, Inc. and Jimmy Neutron at the 2002 Oscars to take the inaugural award." },
  { id:"q15", category:"General", difficulty:"easy", question:"What is the chemical symbol for gold?", options:["Go","Gd","Au","Ag"], correctIndex:2, didYouKnow:"Au comes from the Latin aurum, meaning shining dawn — the same root as the word aura." },
];

// ---- State ----
const STATE_VERSION = 1;
let state = {
  mode: 'daily', // 'daily' | 'endless'
  screen: 'landing',
  dailyQuestions: [],
  endlessQuestions: [],
  currentQ: 0,
  answers: [], // {correct:bool, time:number}
  startTime: 0,
  qStartTime: 0,
  lives: 3,
  endlessStreak: 0,
  endlessBest: 0,
  waiting: false,
  muted: false,
};

let stats = loadStats();

function loadStats() {
  try {
    const raw = localStorage.getItem('synapse_stats_v1');
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { played:0, won:0, streak:0, maxStreak:0, totalCorrect:0, totalAnswered:0, bestEndless:0, lastDate:null };
}
function saveStats() {
  try { localStorage.setItem('synapse_stats_v1', JSON.stringify(stats)); } catch(e){}
}
function loadState() {
  try {
    const raw = localStorage.getItem('synapse_state_v1');
    if (raw) {
      const s = JSON.parse(raw);
      if (s.version === STATE_VERSION && s.date === getToday()) {
        Object.assign(state, s);
        return true;
      }
    }
  } catch(e){}
  return false;
}
function saveState() {
  try {
    localStorage.setItem('synapse_state_v1', JSON.stringify({ ...state, version: STATE_VERSION, date: getToday() }));
  } catch(e){}
}
function clearState() {
  try { localStorage.removeItem('synapse_state_v1'); } catch(e){}
}
function getToday() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// ---- DOM helpers ----
function $(id){ return document.getElementById(id); }
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('screen-'+name).classList.add('active');
  state.screen = name;
}
function toast(msg) {
  const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
  $('toast-host').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

// ---- Daily questions ----
function getDailyQuestions() {
  const seed = getDailySeed();
  const indices = seededShuffle(QUESTIONS.map((_,i)=>i), seed);
  return indices.slice(0,10).map(i=>QUESTIONS[i]);
}
function getEndlessQuestion() {
  const pool = QUESTIONS.filter((_,i)=> !state.endlessQuestions.includes(i));
  const poolIdx = pool.length ? pool : QUESTIONS;
  const pick = poolIdx[Math.floor(Math.random()*poolIdx.length)];
  return pick;
}

// ---- Rendering ----
function renderLandingStats() {
  const el = $('landing-stats');
  const streakFire = stats.streak > 2 ? '🔥' : '';
  el.innerHTML = `
    <div class="stat-chip">Streak<b>${streakFire}${stats.streak}</b></div>
    <div class="stat-chip">Best<b>${stats.maxStreak}</b></div>
    <div class="stat-chip">Played<b>${stats.played}</b></div>
  `;
}
function renderHearts() {
  const el = $('hearts-bar');
  el.innerHTML = Array.from({length:3},(_,i)=>`<span class="heart ${i<state.lives?'':'lost'}">${i<state.lives?'♥':'♡'}</span>`).join('');
}
function renderQuestion() {
  const q = state.mode==='daily' ? state.dailyQuestions[state.currentQ] : state.endlessQuestions[state.endlessQuestions.length-1];
  if (!q) return;
  $('q-tracker').textContent = state.mode==='daily' ? `Question ${state.currentQ+1} / ${state.dailyQuestions.length}` : `Streak ${state.endlessStreak} · Question ${state.endlessQuestions.length}`;
  $('q-text').innerHTML = `<div class="category-tag">${q.category}</div>${escapeHtml(q.question)}`;
  const grid = $('options-grid');
  grid.innerHTML = '';
  q.options.forEach((opt,idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="key-hint">${idx+1}</span><span>${escapeHtml(opt)}</span>`;
    btn.onclick = ()=>handleAnswer(idx);
    grid.appendChild(btn);
  });
  $('feedback-strip').className = 'feedback-strip';
  state.qStartTime = performance.now();
}
function escapeHtml(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

// ---- Game logic ----
function startDaily() {
  state.mode = 'daily';
  state.currentQ = 0;
  state.answers = [];
  state.dailyQuestions = getDailyQuestions();
  state.startTime = performance.now();
  state.lives = 3;
  state.waiting = false;
  $('mode-title').textContent = 'Daily 10';
  $('hearts-bar').style.display = 'none';
  $('timer-bar').style.display = 'block';
  showScreen('playing');
  renderQuestion();
  updateTimerBar();
}
function startEndless() {
  state.mode = 'endless';
  state.currentQ = 0;
  state.answers = [];
  state.endlessQuestions = [];
  state.lives = 3;
  state.endlessStreak = 0;
  state.waiting = false;
  $('mode-title').textContent = 'Endless Gauntlet';
  $('hearts-bar').style.display = 'flex';
  $('timer-bar').style.display = 'none';
  showScreen('playing');
  nextEndlessQuestion();
}
function nextEndlessQuestion() {
  const q = getEndlessQuestion();
  state.endlessQuestions.push(q);
  renderQuestion();
  renderHearts();
}
function updateTimerBar() {
  if (state.mode !== 'daily' || state.screen !== 'playing') return;
  const elapsed = performance.now() - state.startTime;
  const pct = Math.min(100, (elapsed / 120000) * 100); // 2 min total bar
  $('timer-fill').style.width = pct + '%';
  requestAnimationFrame(updateTimerBar);
}

function handleAnswer(idx) {
  if (state.waiting) return;
  const q = state.mode==='daily' ? state.dailyQuestions[state.currentQ] : state.endlessQuestions[state.endlessQuestions.length-1];
  const correct = idx === q.correctIndex;
  const time = performance.now() - state.qStartTime;
  state.answers.push({correct, time, hintUsed:false});

  // Visual feedback
  const btns = document.querySelectorAll('.option-btn');
  btns[idx].classList.add(correct ? 'correct' : 'wrong');
  if (!correct) btns[q.correctIndex].classList.add('correct');

  // Audio
  if (!state.muted) { correct ? audio.correct() : audio.wrong(); }

  // Feedback strip
  const fb = $('feedback-strip');
  $('fb-result').textContent = correct ? 'Correct!' : 'Incorrect';
  $('fb-result').style.color = correct ? 'var(--correct)' : 'var(--wrong)';
  $('fb-insight').textContent = q.didYouKnow;
  fb.className = 'feedback-strip show ' + (correct ? 'correct' : 'wrong');

  state.waiting = true;

  // Lives (endless only)
  if (!correct && state.mode === 'endless') {
    state.lives--;
    renderHearts();
  }

  setTimeout(()=>{
    fb.classList.remove('show');
    if (state.mode === 'daily') {
      state.currentQ++;
      if (state.currentQ >= state.dailyQuestions.length) { finishGame(); }
      else { state.waiting = false; renderQuestion(); }
    } else {
      if (!correct && state.lives <= 0) { finishGame(); return; }
      if (correct) state.endlessStreak++;
      state.waiting = false;
      nextEndlessQuestion();
    }
  }, 1100); // The 1.1s micro-flash
}

function finishGame() {
  const total = state.answers.length;
  const correct = state.answers.filter(a=>a.correct).length;
  const time = Math.round((performance.now() - state.startTime)/1000);
  const today = getToday();

  // Stats
  stats.played++;
  stats.totalAnswered += total;
  stats.totalCorrect += correct;
  if (state.mode === 'daily') {
    if (correct >= 7) {
      if (stats.lastDate !== today) { stats.streak++; stats.lastDate = today; }
    } else {
      stats.streak = 0;
    }
    stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
  } else {
    stats.bestEndless = Math.max(stats.bestEndless, state.endlessStreak);
  }
  saveStats();
  clearState();

  // Results screen
  showScreen('results');
  if (state.mode === 'daily') {
    $('result-title').textContent = 'Daily 10';
    $('result-meta').textContent = today;
    $('result-score').textContent = `${correct}/${total}`;
    let label = 'Keep practicing!';
    if (correct === 10) label = 'Perfect score! 🏆';
    else if (correct >= 8) label = 'Excellent!';
    else if (correct >= 6) label = 'Solid effort!';
    $('result-label').textContent = label;
    $('endless-stats').style.display = 'none';

    // Share grid
    const grid = $('share-grid');
    grid.innerHTML = state.answers.map(a=>`<div>${a.correct ? '🟩' : '🟥'}</div>`).join('');
    const timeStr = fmtTime(time);
    const pct = mockPercentile(correct, total);
    $('share-text').textContent = `Synapse Trivia — Daily 10\n${correct}/${total} · ${timeStr} · Top ${pct}%\n\n${state.answers.map(a=>a.correct?'🟩':'🟥').join('')}\n\nsynapse-trivia.app`;
  } else {
    $('result-title').textContent = 'Game Over';
    $('result-meta').textContent = 'Endless Gauntlet';
    $('result-score').textContent = state.endlessStreak;
    $('result-label').textContent = 'Best streak';
    $('endless-stats').style.display = 'flex';
    $('endless-stats').innerHTML = `
      <div class="endless-stat"><span class="val">${state.endlessStreak}</span><span class="lbl">Streak</span></div>
      <div class="endless-stat"><span class="val">${state.answers.filter(a=>a.correct).length}</span><span class="lbl">Correct</span></div>
      <div class="endless-stat"><span class="val">${state.answers.length}</span><span class="lbl">Total</span></div>
    `;
    $('share-grid').innerHTML = '';
    $('share-text').textContent = `Synapse Trivia — Endless Gauntlet\n🔥 Streak: ${state.endlessStreak}\n✅ Correct: ${state.answers.filter(a=>a.correct).length}/${state.answers.length}\n\nsynapse-trivia.app`;
  }
}

function fmtTime(s) {
  const m = Math.floor(s/60);
  const r = s%60;
  return m ? `${m}m ${r}s` : `${r}s`;
}
function mockPercentile(correct, total) {
  const base = [3,8,15,25,38,52,68,82,92,97,99][correct] || 50;
  const variance = Math.floor(mulberry32(getDailySeed()+correct)()*8);
  return Math.min(99, base + variance);
}

// ---- Input ----
document.addEventListener('keydown', e => {
  if (state.screen !== 'playing' || state.waiting) return;
  const key = e.key.toLowerCase();
  if (key >= '1' && key <= '4') { e.preventDefault(); handleAnswer(parseInt(key)-1); }
  else if (key >= 'a' && key <= 'd') { e.preventDefault(); handleAnswer(key.charCodeAt(0)-97); }
});

// ---- Buttons ----
$('btn-daily').onclick = ()=>{ audio.click(); startDaily(); };
$('btn-endless').onclick = ()=>{ audio.click(); startEndless(); };
$('btn-mute').onclick = ()=>{
  state.muted = !state.muted;
  $('btn-mute').textContent = state.muted ? '🔇' : '🔊';
  toast(state.muted ? 'Sound muted' : 'Sound on');
};
$('btn-close').onclick = ()=>{
  if (confirm('Quit current game? Progress will be lost.')) { clearState(); showScreen('landing'); renderLandingStats(); }
};
$('btn-copy').onclick = ()=>{
  navigator.clipboard.writeText($('share-text').textContent).then(()=>toast('Copied to clipboard!'));
};
$('btn-again').onclick = ()=>{
  audio.click();
  if (state.mode === 'daily') startDaily(); else startEndless();
};
$('btn-home').onclick = ()=>{ audio.click(); showScreen('landing'); renderLandingStats(); };

// ---- Init ----
renderLandingStats();

// Lazy audio init on first interaction
document.addEventListener('click', ()=>audio.init(), {once:true});
</script>
</body>
</html>
